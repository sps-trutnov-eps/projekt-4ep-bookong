<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Přihlášení - BooKong</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Header -->
  <header>
    <nav class="navbar navbar-dark bg-primary">
      <div class="container-fluid">
        <!-- Logo only, no navigation -->
        <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
          <img src="/src/img/logo.png" alt="Logo BooKong" height="40" class="me-2" />
          BooKong
        </a>  
      </div>
    </nav>
  </header>

  <!-- Main: Buttons -->
  <main class="container my-5 flex-grow-1 d-flex justify-content-center align-items-center">
    <form class="w-100" style="max-width: 900px;">
      <h2 class="mb-4 text-primary text-center">Moje knihy</h2>

      <div class="table-responsive mt-4">
        <table class="table table-striped table-bordered align-middle">
          <caption class="text-muted">Historie vypůjčených knih</caption>
          <thead class="table-primary">
            <tr>
              <th scope="col">Název</th>
              <th scope="col">Autor</th>
              <th scope="col">Století</th>
              <th scope="col">Literatura</th>
              <th scope="col">ISBN</th>
            </tr>
          </thead>
          <tbody id="borrow-history">
            <!-- Zde se budou dynamicky vkládat řádky historie -->
          </tbody>
        </table>
      </div>

    </form>
  </main>

  <!-- Footer -->
  <footer class="bg-secondary text-light text-center py-3 mt-auto">
    <p class="mb-0">&copy; 2025 BooKong | Školní knihovní systém</p>
  </footer>

  <script src="mobile-menu.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
