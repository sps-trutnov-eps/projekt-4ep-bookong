name: Deploy Staging

on:
  push:
    branches: [ "staging" ]
  workflow_dispatch:  # Umožní ruční spuštění z GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            APP_DIR="${HOME}/bookong-staging-deployment"
            
            if [ ! -d "$APP_DIR" ]; then
              echo "Error: Deployment directory $APP_DIR does not exist."
              echo "Please create it manually and add .env.staging file first."
              exit 1
            fi
            
            cd "$APP_DIR"
            git fetch origin
            git checkout -B staging origin/staging
            bash deploy/deploy.sh staging
